<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de contenido aleatorio</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <header><h1>Explorador de contenido aleatorio</h1></header>
    <div class="tarjetas">
      <section id="citas">
        <h2>Citas y autores</h2>
        <div class="contenido" aria-live="polite"></div>
        <p class="estado" role="status"></p>
        <button type="button">Obtener otra cita</button>
      </section>
      <section id="perros">
        <h2>Perros</h2>
        <div class="contenido" aria-live="polite"></div>
        <p class="estado" role="status"></p>
        <button type="button">Mostrar otro perro</button>
      </section>
      <section id="gatos">
        <h2>Gatos</h2>
        <div class="contenido" aria-live="polite"></div>
        <p class="estado" role="status"></p>
        <button type="button">Mostrar otro gato</button>
      </section>
      <section id="datos">
        <h2>Datos curiosos</h2>
        <div class="contenido" aria-live="polite"></div>
        <p class="estado" role="status"></p>
        <button type="button">Mostrar otro dato</button>
      </section>
    </div>
  </main>
</body>
</html>
